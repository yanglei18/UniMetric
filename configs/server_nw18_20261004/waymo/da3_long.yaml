runtime:
  dataset: waymo
  data_path: /workspace/data/official-data/waymo
  depth_model: da3_long
  use_shared_scale: true
  all_sequences: true
  sequence_name: []
  frame_count: 1000
  metric_depth_threshold: 100
  enable_metric_depth_bins: false
  metric_depth_bins:
  - 20
  - 40
  - 60
  enable_sparse_reconstruction: true
  sparse_reconstruction_mode: sequence
  sparse_reconstruction_alignment: point_cloud
  sparse_reconstruction_pose_source: pred
  sparse_reconstruction_min_points: 10
  enable_pose_evaluation: true
  pose_evaluation_mode: subsequence
  pose_evaluation_pose_source: pred
  pose_eval_min_frames: 2
  pose_eval_scale: 1.0
  subsequence_size: 1000
  enable_visualization: false
  cleanup_depth_outputs_after_metrics: true
parallel:
  enable: true
  max_gpus: 10
  vlm_api_enable: true
  max_vlm_workers: 1
  metric_workers: 8
vision:
  model_path: '{qwen_model}'
  model_type: doubao
  api_key_env: DOUBAO_API_KEY
  model_version: seed-1.8-max
  torch_dtype: bfloat16
  max_new_tokens: 400096
  reasoning_effort: null
  thinking_type: disabled
  thinking_budget_tokens: null
  temperature: 0.2
  top_p: null
  num_beams: 1
  max_video_frames: 50
  video_fps: 10.0
depth:
  input_pixel_limit: 255000
  input_max_long_edge: 504
  long_chunk_size: 60
  long_overlap: 20
  long_delete_temp_files: true
  long_temp_root: /workspace/tmp/metric-depth-new-temp
  output_resolution: original
  native_sampling_mode: nearest
semantic_scale:
  relative_height_mode: peak_to_bottom
  shared_plane_mode: global_plane
  height_anchor_source: dynamic
  frame_parallel_workers: 10
  use_depth_confidence: true
  use_anchor_quality_filter: true
  use_depth_geometry_filter: true
  save_scale_intermediate_results: false
  depth_geometry_min_anchor_points: 32
  depth_geometry_min_relative_height: 0.001
  use_vlm_anchor_confidence_filter: true
  vlm_dynamic_anchor_confidence_threshold: 0.85
  vlm_static_anchor_confidence_threshold: 0.6
  anchor_quality_min_percentile: 0.1
  anchor_quality_max_percentile: 0.8
  plane_conf_percentile: 0.8
  plane_normal_outlier_filter_enabled: true
  plane_normal_filter_max_angle_deg: 25.0
  optimized_scale_priority_modulation_strength: 0.3
  distance_weight_near: 1.0
  distance_weight_middle: 1.0
  distance_weight_distant: 1.0
  optimizer_dynamic_classes: []
  optimizer_static_classes:
  - traffic cone
  default_optimized_variant: optimized_scale_original
  enable_optimized_scale_legacy: false
  enable_optimized_scale_original: true
  enable_optimized_scale_weighted_bi: false
  enable_optimized_scale_weighted_ifpa: false
  enable_selected_scale: false
  selected_scale_default: consistent_scale
  min_valid_intervals_for_optimized: null
  min_consistent_count_for_optimized: null
  max_optimized_shift_ratio: 0.03
  weighted_search_mode: global
  consensus_prior_mode: point
  consensus_prior_strength: 0.5
  sequence_difficulty:
    enabled: true
    dataset_summary_path: '{output_root}/{dataset_name}/metric_results/{depth_model}/dataset_summary.json'
    easy_d1_gain_threshold: 0.5
    profiles:
      easy:
        distance_weight_near: 1.0
        distance_weight_middle: 1.0
        distance_weight_distant: 1.0
        optimizer_dynamic_classes: []
        optimizer_static_classes:
        - traffic cone
      mid:
        distance_weight_near: 1.0
        distance_weight_middle: 1.0
        distance_weight_distant: 1.0
        optimizer_dynamic_classes: []
        optimizer_static_classes:
        - traffic cone
      hard:
        distance_weight_near: 1.0
        distance_weight_middle: 1.0
        distance_weight_distant: 1.0
        optimizer_dynamic_classes: []
        optimizer_static_classes:
        - traffic cone
  consensus_prior_interval_inside_ratio: 0.2
  ifpa_num_bins: 128
  ifpa_use_weight: true
  bi_keep_ratio: 0.6
  bi_min_segment_width: 1.0e-06
models:
  da3_model_name: /workspace/weights/DA3-LARGE
paths:
  project_root: '{project_root}'
  output_root: /workspace/nw18-runs-20261004
  pretrained_model_dir: '{project_root}/pretrained_model'
  qwen_model: '{pretrained_model_dir}/Qwen3-VL-30B-A3B-Instruct'
  sam_config: configs/sam2.1/sam2.1_hiera_l.yaml
  sam_checkpoint: '{project_root}/checkpoints/sam2.1_hiera_large.pt'
  vehicle_data: '{data_path}'
  output: '{output_root}/{dataset_name}/{sequence_name}'
  vlm_output: '{output}/vlm_outputs'
  vlm_results: '{vlm_output}/results'
  vlm_visualization: '{vlm_output}/visualization'
  sam_output: '{output}/sam_outputs'
  sam_visualization: '{sam_output}/visualization'
  sam_aligned_anchor: '{sam_output}/aligned_anchor_plys'
  da3_output: '{output}/da3_outputs'
  da3_relative_scale: '{da3_output}/relative_scale'
  da3_absolute_scale: '{da3_output}/absolute_scale'
  p3_images: '{project_root}/p3_images/{dataset_name}/{sequence_name}'
