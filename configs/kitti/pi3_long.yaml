# kitti / pi3_long production configuration.
# Comments explain options; the parameter values below are unchanged.

# Dataset/sequence selection, evaluation settings, and output lifecycle.

runtime:
  # Logical dataset name used in outputs and prompt routing.
  # Common values: "argoverse", "v2x-radar-i", "dair-v2x-i", "kitti", "waymo", "nuscenes".
  dataset: kitti
  # Dataset root directory.
  data_path: data/official-data/kitti/
  # Selected depth model wrapper; this YAML filename identifies the production model.
  # The published matrix contains nine depth-model configs per dataset.
  depth_model: pi3_long
  # true: estimate one shared scale for a subsequence / sequence batch.
  # false: estimate scale frame by frame.
  use_shared_scale: true
  # true: process every sequence under data_path.
  # false: use sequence_name or current sequence routing.
  all_sequences: true
  # [] or "" means all sequences.
  # A non-empty list processes only those sequences, for example:
  # sequence_name: ["scene-0092", "scene-0015", "scene-0013"]
  sequence_name: []

  # Requested frame count for selected-sequence runs and metric reporting.
  # With all_sequences enabled, the pipeline may process complete sequences.
  frame_count: 1000
  # Maximum GT depth (meters) included in metric geometry evaluation.
  # Set to null to disable distance filtering during metrics.
  metric_depth_threshold: 100
  # Distance-bin edges (meters) used for segmented metric geometry reports.
  # This yields bins: 0-20m / 20-40m / 40-60m / 60m+.
  enable_metric_depth_bins: false
  metric_depth_bins:
  - 20
  - 40
  - 60
  # true: report a LiDAR-referenced sparse 3D reconstruction proxy.
  # This samples predictions only at LiDAR-projected camera pixels.
  enable_sparse_reconstruction: true
  # Sparse reconstruction evaluation mode: frame | sequence.
  # frame: evaluate each frame independently.
  # sequence: fuse each subsequence into its first camera coordinate.
  sparse_reconstruction_mode: sequence
  # Sparse reconstruction global SE3 alignment source: trajectory | point_cloud.
  # trajectory: fit SE3 from predicted and GT camera trajectories.
  # point_cloud: fit SE3 directly from sparse pred/GT point pairs.
  sparse_reconstruction_alignment: point_cloud
  # Pose source for sequence-level sparse reconstruction: pred | gt.
  # pred uses depth model predicted camera trajectory; gt uses dataset GT camera trajectory.
  sparse_reconstruction_pose_source: pred
  # Minimum valid LiDAR-projected samples required for sparse reconstruction metrics.
  sparse_reconstruction_min_points: 10
  # true: report TUM-style camera trajectory metrics from saved camera_params.
  # ATE uses SE3 alignment only; no Sim3 scale correction is applied.
  enable_pose_evaluation: true
  # Pose evaluation grouping mode: subsequence | sequence.
  # subsequence is safer when depth inference is split by subsequence_size.
  pose_evaluation_mode: subsequence
  # Pose source for TUM pose evaluation: pred | gt.
  # pred evaluates depth model predicted trajectory; gt is a sanity-check upper bound.
  pose_evaluation_pose_source: pred
  # Minimum valid poses required for ATE/RPE in each pose group.
  pose_eval_min_frames: 2
  # Manual multiplier for predicted camera translations. Keep 1.0 for scale-aware evaluation.
  pose_eval_scale: 1.0
  # Used when long sequences are split into smaller subsequences.
  subsequence_size: 1000
  # Global visualization switch.
  # true: save all visualization outputs, including depth, SAM/VLM, metric pose,
  # sparse reconstruction, semantic scale, and final result visualizations.
  # false: disable all visualization outputs to save time and disk.
  enable_visualization: false
  # true: after metrics are saved, remove files/subdirectories inside the
  # current depth model output directory, e.g. scal3r_outputs/*.
  cleanup_depth_outputs_after_metrics: false
# GPU, VLM API, and metric-evaluation worker settings.

parallel:
  # Enable sequence-level multi-GPU scheduling when available.
  enable: true
  # Upper bound on GPU workers used by the main pipeline.
  max_gpus: 10
  # Enable parallel API-based VLM requests inside the VLM stage.
  vlm_api_enable: true
  # Worker count for parallel VLM API calls.
  max_vlm_workers: 1
  # Used by metric geometry evaluation and postprocess frame cache building.
  # 0 or 1: serial. >1: threaded parallelism.
  metric_workers: 8
# Vision-language backend and generation options; keep API keys in the environment.

vision:
  # Local VLM path or model identifier template.
  model_path: '{qwen_model}'

  # VLM backend: doubao or qwen-api for API calls; qwen for a local model.
  model_type: doubao
  # Environment variable holding the API key for the configured backend.
  # Example: export DOUBAO_API_KEY=...
  api_key_env: DOUBAO_API_KEY
  # Backend-specific model version / endpoint name.
  model_version: seed-1.8-max
  # Torch dtype used by local models. Typical values:
  # "float16", "bfloat16", "float32".
  torch_dtype: bfloat16
  # Maximum generation length for VLM responses.
  max_new_tokens: 400096
  # Optional reasoning level for supported APIs.
  # Typical values: null, "low", "medium", "high".
  reasoning_effort: null
  # Optional backend setting.
  # Typical values: null, "enabled", "disabled".
  thinking_type: disabled
  # Optional token budget when explicit thinking is supported.
  thinking_budget_tokens: null
  # Standard generation controls.
  temperature: 0.2
  top_p: null
  num_beams: 1
  # Used when preparing video-style VLM input.
  max_video_frames: 50
  video_fps: 10.0
# Depth input size, chunking, temporary storage, and saved resolution.

depth:
  # Legacy pixel-budget fallback for model input resizing.
  input_pixel_limit: 255000
  # Optional upper bound for model input longest side (pixels).
  # null: keep legacy pixel_limit-based resizing.
  input_max_long_edge: null
  # Number of frames per chunk for long-sequence depth estimation.
  long_chunk_size: 60
  # Overlap between adjacent chunks.
  long_overlap: 20
  # Whether to remove temporary files created during long-sequence inference.
  long_delete_temp_files: true
  # Optional custom temp directory. Empty string means default behavior.
  long_temp_root: /data1/yanglei/outputs/Metric-Depth-new-repro/tmp
  # Saved prediction resolution. Options: "original", "native".
  output_resolution: native
  # Sampling mode for native-resolution predictions. Options: "nearest", "bilinear".
  native_sampling_mode: nearest
# Anchor filtering, geometry checks, and metric-scale optimization.

semantic_scale:
  relative_height_mode: peak_to_bottom
  shared_plane_mode: global_plane
  height_anchor_source: dynamic
  frame_parallel_workers: 10
  use_depth_confidence: true
  use_anchor_quality_filter: true
  use_depth_geometry_filter: true
  save_scale_intermediate_results: true
  depth_geometry_min_anchor_points: 32
  depth_geometry_min_relative_height: 0.001
  use_vlm_anchor_confidence_filter: true
  vlm_dynamic_anchor_confidence_threshold: 0.85
  vlm_static_anchor_confidence_threshold: 0.6
  anchor_quality_min_percentile: 0.0
  anchor_quality_max_percentile: 0.35
  plane_conf_percentile: 0.8
  optimized_scale_priority_modulation_strength: 0.1
  distance_weight_near: 1.0
  distance_weight_middle: 1.0
  distance_weight_distant: 1.0
  optimizer_dynamic_classes: &id001
  - car
  - pedestrian
  - van
  - cyclist
  - suv
  optimizer_static_classes: []
  default_optimized_variant: optimized_scale_weighted_bi
  enable_optimized_scale_legacy: false
  enable_optimized_scale_original: true
  enable_optimized_scale_weighted_bi: true
  enable_optimized_scale_weighted_ifpa: false
  enable_selected_scale: true
  selected_scale_default: optimized_scale_weighted_bi
  min_valid_intervals_for_optimized: null
  min_consistent_count_for_optimized: null
  max_optimized_shift_ratio: 10.0
  weighted_search_mode: consensus_bounded
  consensus_prior_mode: point
  consensus_prior_strength: 0.5
  # Optional easy/mid/hard sequence profiles and explicit hard-sequence names.
  sequence_difficulty:
    enabled: true
    mode: single_metric
    dataset_summary_path: '{project_root}/configs/kitti/scale_profile_reference/pi3_full8_weighted.json'
    metric_variant: optimized_weighted_bi
    metric_scope: depth_frame_mean
    metric_name: rel
    metric_goal: lower_is_better
    easy_threshold: 0.18
    mid_threshold: 0.24
    profiles:
      easy: &id002
        height_anchor_source: both
        anchor_quality_min_percentile: 0.0
        anchor_quality_max_percentile: 0.35
        optimizer_dynamic_classes: *id001
        optimizer_static_classes:
        - traffic cone
        default_optimized_variant: optimized_scale_original
        weighted_search_mode: consensus_bounded
        dynamic_anchor_height_scale: 0.7
        optimized_scale_priority_modulation_strength: 0.1
        selected_scale_default: optimized_scale_weighted_bi
        max_optimized_shift_ratio: 0.35
      mid: *id002
      hard:
        height_anchor_source: both
        anchor_quality_min_percentile: 0.1
        anchor_quality_max_percentile: 0.5
        optimizer_dynamic_classes: []
        optimizer_static_classes:
        - traffic cone
        default_optimized_variant: optimized_scale_original
        weighted_search_mode: global
        dynamic_anchor_height_scale: 1.0
        optimized_scale_priority_modulation_strength: 0.3
        max_optimized_shift_ratio: 0.04
        selected_scale_default: consistent_scale
  consensus_prior_interval_inside_ratio: 0.2
  ifpa_num_bins: 128
  ifpa_use_weight: true
  bi_keep_ratio: 0.6
  bi_min_segment_width: 1.0e-06
  dynamic_anchor_height_scale: 0.7
  min_optimized_to_consistent_ratio: 1.0
# The selected depth model implementation and checkpoint settings.

models:
  # Local checkpoint path for Pi3 / Pi3X.
  pi3_weights: /data1/yanglei/MetricDepth/weights/Pi3X
# Input/output path templates resolved for this run.

paths:
  # Base project path template.
  project_root: '{project_root}'
  # Output root template.
  output_root: '{project_root}/outputs'
  # Directory holding local pretrained models.
  pretrained_model_dir: '{project_root}/pretrained_model'
  # Default Qwen model path template.
  qwen_model: '{pretrained_model_dir}/Qwen3-VL-30B-A3B-Instruct'
  # SAM config file path.
  sam_config: configs/sam2.1/sam2.1_hiera_l.yaml
  # SAM checkpoint path.
  sam_checkpoint: '{project_root}/checkpoints/sam2.1_hiera_large.pt'
  # Alias for the active dataset path.
  vehicle_data: '{data_path}'
  # Sequence-level output root.
  output: '{output_root}/{dataset_name}/{sequence_name}'
  # VLM outputs and subdirectories.
  vlm_output: '{output}/vlm_outputs'
  vlm_results: '{vlm_output}/results'
  vlm_visualization: '{vlm_output}/visualization'
  # SAM outputs and subdirectories.
  sam_output: '{output}/sam_outputs'
  sam_visualization: '{sam_output}/visualization'
  sam_aligned_anchor: '{sam_output}/aligned_anchor_plys'
  # Pi3 outputs.
  pi3_output: '{output}/pi3_outputs'
  # Prepared P3 image directory.
  p3_images: '{project_root}/p3_images/{sequence_name}'
